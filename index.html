<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=0.35, maximum-scale=2.0, user-scalable=yes">
  <title>Free Wifi Espiritual</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Free Wifi Espiritual</h1>
      <div class="school-logo-placeholder">
        <img src="logo.png" alt="Patio Digital">
      </div>
    </header>

    <section class="input-section">
      <input type="text" id="userInput" placeholder="Tu nombre...">
      <textarea id="commentInput" placeholder="Escribe un mensaje..."></textarea>
      <button id="publishBtn">Publicar</button>
    </section>

    <main class="layout-grid">
      <aside class="left-column">
        <div class="wifi-container">
          <div class="bar bar-3"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-1"></div>
          <div class="dot"></div>
        </div>
        <p id="statusMessage">Conectando ...</p>
        <img id="caricaturaWifi" src="cariWifi1.png" alt="Caricatura1">
      </aside>

      <section class="wall-container">
        <div id="wall" class="wall"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
